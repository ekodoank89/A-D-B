name: Build A-D-B

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/adb-release.jks"
          ls -la "$GITHUB_WORKSPACE/app/adb-release.jks"

      - name: Build release APKs (app + testapp)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :testapp:assembleRelease --no-daemon --stacktrace

        - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk A-D-B-release.apk
          cp testapp/build/outputs/apk/release/testapp-release.apk LocTest-release.apk
          ls -la A-D-B-release.apk LocTest-release.apk
          
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A-D-B-release
          path: |
            A-D-B-release.apk
            LocTest-release.apk
          if-no-files-found: error
